name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build native agent (x64 and x86)
        shell: pwsh
        working-directory: native/agent
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset x64
          cmake --build --preset x64
          cmake --preset x86
          cmake --build --preset x86

      - name: Publish CLI, Studio and agents
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $root = "publish/hokusai-$version"
          dotnet publish src/Hokusai.Cli -c Release -r win-x64 --self-contained false -p:Version=$version -o "$root"
          dotnet publish src/Hokusai.Studio -c Release -r win-x64 --self-contained false -p:Version=$version -o "$root/studio"
          New-Item -ItemType Directory -Force "$root/agents" | Out-Null
          Copy-Item native/agent/build/x64/Release/hokusai_agent64.dll, native/agent/build/x64/Release/hokusai_launcher64.exe "$root/agents"
          Copy-Item native/agent/build/x86/Release/hokusai_agent32.dll, native/agent/build/x86/Release/hokusai_launcher32.exe "$root/agents"
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md "$root"
          Compress-Archive -Path "$root/*" -DestinationPath "publish/hokusai-$version-win-x64.zip"
          Push-Location publish
          Get-ChildItem *.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content -Encoding ascii SHA256SUMS
          Pop-Location

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: publish/*.zip

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version." }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $notes = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $notes | Set-Content -Encoding utf8 publish/RELEASE_NOTES.md

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' publish/*.zip publish/SHA256SUMS --title '${{ github.ref_name }}' --notes-file publish/RELEASE_NOTES.md
